name: iOS App Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package-tests:
    name: Swift Package Tests
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Run Swift Package Tests (macOS)
        run: |
          swift test

  milestone1-torrent-build:
    name: Milestone 1-3 — libtorrent 2.0 iOS Native Build, Bridge & Transfer Engine Test
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Ensure Boost Headers
        run: |
          BOOST_DIR=$(brew --prefix boost 2>/dev/null || true)
          if [ -z "$BOOST_DIR" ] || [ ! -d "$BOOST_DIR/include/boost" ]; then
            echo "Installing Boost..."
            brew install boost
          else
            echo "Boost available at: $BOOST_DIR"
          fi

      - name: Compile libtorrent 2.0 and Objective-C++ Bridge
        run: |
          chmod +x scripts/build_libtorrent_ios.sh
          ./scripts/build_libtorrent_ios.sh

      - name: Verify Architecture Slices and Headers
        run: |
          echo "=== Inspecting Framework Structure ==="
          ls -la Frameworks/LibTorrent.xcframework
          echo "=== Device Slice Architecture ==="
          lipo -info Frameworks/LibTorrent.xcframework/ios-arm64/*.a
          echo "=== Simulator Slice Architectures ==="
          lipo -info Frameworks/LibTorrent.xcframework/ios-arm64_x86_64-simulator/*.a
          echo "=== Exported Headers ==="
          ls -la Frameworks/LibTorrent.xcframework/ios-arm64/Headers

      - name: Test Session Creation and Teardown on iOS Simulator
        run: |
          SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          cat << 'EOF' > test_session_lifecycle.swift
          import Foundation
          import LibTorrent

          @main
          struct TestRunner {
              static func main() async throws {
                  print("--- Milestone 1 Verification Test: Objective-C++ Bridge ---")
                  let ver = TorrentSessionBridge.libtorrentVersion()
                  print("libtorrent version reported: \(ver)")
                  guard ver.hasPrefix("2.0.") else {
                      print("FAIL: Expected version prefix '2.0.', got '\(ver)'")
                      exit(1)
                  }

                  let tempDir = NSTemporaryDirectory() + "m1_test_" + UUID().uuidString
                  try FileManager.default.createDirectory(atPath: tempDir, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(atPath: tempDir) }

                  let bridge = TorrentSessionBridge(storagePath: tempDir, portStart: 6881, portEnd: 6891)
                  print("Storage path: \(bridge.storagePath)")
                  assert(!bridge.isListening, "Session should not be listening before start")
                  assert(bridge.listenPort == 0, "Listen port should be 0 before start")

                  do {
                      try bridge.startSession()
                      print("Session successfully started!")
                  } catch {
                      print("FAIL: Failed to start session: \(error)")
                      exit(2)
                  }

                  print("isListening: \(bridge.isListening)")
                  print("listenPort: \(bridge.listenPort)")
                  assert(bridge.isListening, "Session should report isListening == true")
                  assert(bridge.listenPort > 0, "Listen port should be non-zero")

                  bridge.stopSession()
                  print("Session stopped cleanly!")
                  assert(!bridge.isListening, "Session should report isListening == false after stop")
                  print("--- Milestone 1 SUCCESS: Native Build & Session Lifecycle Verified ---")

                  print("--- Milestone 2 Verification Test: TorrentEngine Actor Facade ---")
                  let engineDir = NSTemporaryDirectory() + "m2_test_" + UUID().uuidString
                  try FileManager.default.createDirectory(atPath: engineDir, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(atPath: engineDir) }

                  let engine = TorrentEngine(storageDirectoryURL: URL(fileURLWithPath: engineDir), portStart: 6882, portEnd: 6892)
                  var status = await engine.status()
                  assert(!status.isRunning, "Engine should report isRunning == false initially")
                  assert(!status.isListening, "Engine should report isListening == false initially")
                  assert(status.listenPort == 0, "Engine listenPort should be 0 initially")
                  assert(status.libtorrentVersion.hasPrefix("2.0."), "Engine status should have libtorrent version")

                  try await engine.start()
                  print("TorrentEngine actor started successfully!")
                  status = await engine.status()
                  assert(status.isRunning, "Engine should report isRunning == true")
                  assert(status.isListening, "Engine should report isListening == true")
                  assert(status.listenPort > 0, "Engine listenPort should be non-zero")
                  print("TorrentEngine listening on port: \(status.listenPort)")

                  // Idempotent start call
                  try await engine.start()
                  status = await engine.status()
                  assert(status.isRunning, "Engine should remain running on repeated start")

                  await engine.stop()
                  print("TorrentEngine actor stopped cleanly!")
                  status = await engine.status()
                  assert(!status.isRunning, "Engine should report isRunning == false after stop")
                  assert(!status.isListening, "Engine should report isListening == false after stop")
                  print("--- Milestone 2 SUCCESS: TorrentEngine Actor Lifecycle Verified ---")

                  print("--- Milestone 3 Verification Test: Magnet Ingestion & Transfer Controls ---")
                  let m3Dir = NSTemporaryDirectory() + "m3_test_" + UUID().uuidString
                  try FileManager.default.createDirectory(atPath: m3Dir, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(atPath: m3Dir) }

                  let m3Engine = TorrentEngine(storageDirectoryURL: URL(fileURLWithPath: m3Dir), portStart: 6883, portEnd: 6893)
                  try await m3Engine.start()

                  let magnet = "magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567&dn=UbuntuDemo"
                  let task = try await m3Engine.addTorrent(magnetURI: magnet)
                  print("Added magnet torrent with info-hash: \(task.infoHash), name: \(task.name)")
                  assert(task.infoHash == "0123456789abcdef0123456789abcdef01234567", "Info-hash must match magnet")
                  assert(task.name == "UbuntuDemo", "Task name must match magnet display name")

                  let fetchedTask = await m3Engine.task(for: task.infoHash)
                  assert(fetchedTask != nil, "Task must be retrievable by infoHash")
                  assert(fetchedTask?.infoHash == task.infoHash, "Retrieved task infoHash must match")

                  let allTasks = await m3Engine.allTasks()
                  assert(allTasks.count == 1, "allTasks should return exactly 1 task")

                  try await m3Engine.pause(infoHash: task.infoHash)
                  let paused = await m3Engine.task(for: task.infoHash)
                  assert(paused?.state == .paused, "Task state should be paused after pause()")
                  print("Torrent transfer paused successfully!")

                  try await m3Engine.resume(infoHash: task.infoHash)
                  let resumed = await m3Engine.task(for: task.infoHash)
                  assert(resumed?.state != .paused, "Task state should no longer be paused after resume()")
                  print("Torrent transfer resumed successfully!")

                  try await m3Engine.remove(infoHash: task.infoHash, deleteFiles: false)
                  let afterRemove = await m3Engine.task(for: task.infoHash)
                  assert(afterRemove == nil, "Task should be nil after removal")
                  let remainingTasks = await m3Engine.allTasks()
                  assert(remainingTasks.count == 0, "allTasks should be empty after removal")
                  print("Torrent transfer removed successfully!")

                  await m3Engine.stop()
                  print("--- Milestone 3 SUCCESS: Core Torrent Downloads & Controls Verified ---")

                  print("--- Milestone 4 Verification Test: Persistence, Fast-Resume & Queue Recovery ---")
                  let m4Dir = NSTemporaryDirectory() + "m4_test_" + UUID().uuidString
                  try FileManager.default.createDirectory(atPath: m4Dir, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(atPath: m4Dir) }

                  let m4Engine = TorrentEngine(
                      storageDirectoryURL: URL(fileURLWithPath: m4Dir),
                      portStart: 6943,
                      portEnd: 6953,
                      maxConcurrentTorrents: 2
                  )
                  try await m4Engine.start()

                  let mag1 = "magnet:?xt=urn:btih:1111111111111111111111111111111111111111&dn=FirstTorrent"
                  let mag2 = "magnet:?xt=urn:btih:2222222222222222222222222222222222222222&dn=SecondTorrent"
                  let mag3 = "magnet:?xt=urn:btih:3333333333333333333333333333333333333333&dn=ThirdTorrent"

                  _ = try await m4Engine.addTorrent(magnetURI: mag1, priority: .normal)
                  _ = try await m4Engine.addTorrent(magnetURI: mag2, priority: .high)
                  _ = try await m4Engine.addTorrent(magnetURI: mag3, priority: .low)

                  let snap = await m4Engine.queueSnapshot()
                  assert(snap?.totalTorrents == 3, "Total torrents should be 3")
                  assert(snap?.activeCount == 2, "Active count should be 2 respecting concurrency limit")
                  assert(snap?.queuedCount == 1, "Queued count should be 1")
                  print("Queue concurrency enforced: active=2, queued=1")

                  // Explicitly pause the second torrent
                  try await m4Engine.pause(infoHash: "2222222222222222222222222222222222222222")
                  let snapPaused = await m4Engine.queueSnapshot()
                  assert(snapPaused?.pausedCount == 1, "Paused count should be 1")
                  assert(snapPaused?.activeCount == 2, "Third torrent promoted into vacated active slot")
                  print("Explicit pause and promotion verified!")

                  // Stop engine with fast-resume generation and persistence
                  await m4Engine.stop(timeoutSeconds: 2.0)
                  print("TorrentEngine stopped cleanly with resume-data generation!")

                  // Relaunch fresh engine on the same storage directory
                  let freshEngine = TorrentEngine(
                      storageDirectoryURL: URL(fileURLWithPath: m4Dir),
                      portStart: 6943,
                      portEnd: 6953,
                      maxConcurrentTorrents: 2
                  )
                  try await freshEngine.start()
                  let restoredSnap = await freshEngine.queueSnapshot()
                  assert(restoredSnap?.totalTorrents == 3, "All 3 torrents must survive application restart")
                  assert(restoredSnap?.pausedCount == 1, "Explicitly paused torrent must remain paused upon relaunch")
                  print("Crash recovery & persistence verified: total=3, paused=1 preserved!")

                  await freshEngine.stop()
                  print("--- Milestone 4 SUCCESS: Persistence, Fast-Resume & Queue Recovery Verified ---")
              }
          }
          EOF

          SIM_HEADERS="$(pwd)/Frameworks/LibTorrent.xcframework/ios-arm64_x86_64-simulator/Headers"
          SIM_ARCHIVE="$(pwd)/Frameworks/LibTorrent.xcframework/ios-arm64_x86_64-simulator/libLibTorrent-sim.a"

          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios15.0-simulator \
            -sdk "$SIM_SDK" \
            -parse-as-library \
            -I "$SIM_HEADERS" \
            "$SIM_ARCHIVE" \
            -Xlinker -lc++ \
            -Xlinker -liconv \
            -Xlinker -framework -Xlinker Security \
            -Xlinker -framework -Xlinker SystemConfiguration \
            Engine/TorrentModels.swift \
            Engine/TorrentPersistenceStore.swift \
            Engine/TorrentQueueScheduler.swift \
            Engine/TorrentEngine.swift \
            test_session_lifecycle.swift \
            -o test_session_lifecycle_sim

          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone 15|iPhone 14|iPhone 16|iPhone" | head -n 1 | sed -E 's/^[[:space:]]+//; s/ \([A-F0-9-]+\)//')
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone 15|iPhone 14|iPhone 16|iPhone" | head -n 1 | sed -E 's/.* \(([A-F0-9-]+)\).*/\1/')
          echo "Booting simulator: $SIM_NAME ($SIM_ID)..."
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl spawn "$SIM_ID" ./test_session_lifecycle_sim

      - name: Upload LibTorrent XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: LibTorrent-iOS-XCFramework
          path: Frameworks/LibTorrent.xcframework
          retention-days: 14

  build-simulator:
    name: iOS Simulator Build
    runs-on: macos-14
    needs: [milestone1-torrent-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi

      - name: Download LibTorrent XCFramework
        uses: actions/download-artifact@v4
        with:
          name: LibTorrent-iOS-XCFramework
          path: Frameworks/LibTorrent.xcframework

      - name: Verify Framework Presence
        run: |
          ls -la Frameworks/LibTorrent.xcframework
          lipo -info Frameworks/LibTorrent.xcframework/ios-arm64_x86_64-simulator/*.a

      - name: Build iOS Application Target (Simulator)
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone 15|iPhone 14|iPhone 16|iPhone" | head -n 1 | sed -E 's/^[[:space:]]+//; s/ \([A-F0-9-]+\)//')
          echo "Selected simulator device: ${SIM_NAME:-iPhone 15}"
          xcodebuild \
            -project SwiftDownloadEngine.xcodeproj \
            -scheme SwiftDownloadEngine \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIM_NAME:-iPhone 15}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Dump Diagnostic Reports on Failure
        if: failure()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*; do
            if [ -f "$f" ]; then
              echo "=== Diagnostic Report: $f ==="
              head -n 60 "$f"
            fi
          done

      - name: Package Simulator App Bundle
        run: |
          APP_PATH=$(find build/Build/Products -name "SwiftDownloadEngine.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: SwiftDownloadEngine.app not found!"
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r -y SwiftDownloadEngine-Simulator.zip SwiftDownloadEngine.app
          ls -lh SwiftDownloadEngine-Simulator.zip
          mkdir -p "$GITHUB_WORKSPACE/artifact-simulator"
          cp SwiftDownloadEngine-Simulator.zip "$GITHUB_WORKSPACE/artifact-simulator/"

      - name: Upload Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDownloadEngine-iOS-Simulator
          path: artifact-simulator/SwiftDownloadEngine-Simulator.zip
          retention-days: 14

  build-device:
    name: iOS Device Build
    runs-on: macos-14
    needs: [milestone1-torrent-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi

      - name: Download LibTorrent XCFramework
        uses: actions/download-artifact@v4
        with:
          name: LibTorrent-iOS-XCFramework
          path: Frameworks/LibTorrent.xcframework

      - name: Verify Framework Presence
        run: |
          ls -la Frameworks/LibTorrent.xcframework
          lipo -info Frameworks/LibTorrent.xcframework/ios-arm64/*.a

      - name: Build iOS Application Target (Device - Unsigned)
        run: |
          xcodebuild \
            -project SwiftDownloadEngine.xcodeproj \
            -scheme SwiftDownloadEngine \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Dump Diagnostic Reports on Failure
        if: failure()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*; do
            if [ -f "$f" ]; then
              echo "=== Diagnostic Report: $f ==="
              head -n 60 "$f"
            fi
          done

      - name: Package Device App Bundle and IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "SwiftDownloadEngine.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: SwiftDownloadEngine.app not found!"
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "Found device app bundle at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"

          # 1. Package raw app bundle
          zip -r -y SwiftDownloadEngine-Device.zip SwiftDownloadEngine.app

          # 2. Package standard .ipa payload for sideloading
          mkdir -p Payload
          cp -r SwiftDownloadEngine.app Payload/
          zip -r -y SwiftDownloadEngine-Unsigned.ipa Payload
          rm -rf Payload

          ls -lh SwiftDownloadEngine-Device.zip SwiftDownloadEngine-Unsigned.ipa
          mkdir -p "$GITHUB_WORKSPACE/artifact-device"
          cp SwiftDownloadEngine-Device.zip "$GITHUB_WORKSPACE/artifact-device/"
          cp SwiftDownloadEngine-Unsigned.ipa "$GITHUB_WORKSPACE/artifact-device/"

      - name: Upload Device Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDownloadEngine-iOS-Device
          path: artifact-device/*
          retention-days: 14
